[package]
name = "candle-kernels"
version = "0.9.2"
edition = "2021"

description = "CUDA kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[dependencies]

[build-dependencies]
cudaforge = { version = "0.1.2", optional = true }

[features]
default = ["nvcc"]
nvcc = ["dep:cudaforge"]
